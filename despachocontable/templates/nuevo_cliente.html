<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Cliente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <h3 class="mb-4">Registrar Nuevo Cliente/Empresa</h3>
        <form method="POST" class="card p-4 shadow-sm">
            <div class="mb-3">
                <label class="form-label">RFC</label>
                <input type="text" name="rfc" class="form-control" placeholder="XAXX010101000" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Razón Social / Nombre</label>
                <input type="text" name="razon_social" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Régimen Fiscal</label>
                <input type="text" name="regimen" class="form-control" placeholder="601 - General de Ley Personas Morales" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo Electrónico</label>
                <input type="email" name="correo" class="form-control">
            </div>
            <button type="submit" class="btn btn-success w-100">Guardar Cliente</button>
            <a href="/" class="btn btn-link w-100 text-center mt-2">Cancelar</a>
        </form>
    </div>
</body>
</html>
