<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registrar Factura - {{ cliente[2] }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 650px;">
        <h3 class="mb-3">Registrar Movimiento / Factura</h3>
        <p class="text-muted">Cliente: <strong>{{ cliente[2] }}</strong> ({{ cliente[1] }})</p>

        <form method="POST" class="card p-4 shadow-sm bg-white">
            <div class="mb-3">
                <label class="form-label">Tipo de Movimiento</label>
                <select name="tipo" class="form-select" required>
                    <option value="Ingreso">Ingreso (Factura Emitida / Cobro)</option>
                    <option value="Gasto/Egreso">Gasto / Egreso (Factura Recibida / Valor Negativo)</option>
                </select>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">RFC Emisor</label>
                    <input type="text" name="rfc_emisor" class="form-control" value="{{ cliente[1] }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">RFC Receptor</label>
                    <input type="text" name="rfc_receptor" class="form-control" placeholder="XAXX010101000" required>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label">Concepto / Descripción</label>
                <input type="text" name="concepto" class="form-control" placeholder="Ej. Servicios de consultoría contable" required>
            </div>

            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">Subtotal ($)</label>
                    <input type="number" step="0.01" name="subtotal" class="form-control" placeholder="0.00" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">IVA ($)</label>
                    <input type="number" step="0.01" name="iva" class="form-control" placeholder="0.00" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100">Guardar Factura</button>
            <a href="/cliente/{{ cliente[0] }}/dashboard" class="btn btn-link w-100 text-center mt-2">Cancelar</a>
        </form>
    </div>
</body>
</html>
